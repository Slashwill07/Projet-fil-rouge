<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>ChoixAvatar</title>
        <link rel="stylesheet" href="Regles.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>

    <body class="page">
        <h1>Choisis ton avatar!</h1>
        <form action="Accueil.html">
          <div class="grille-choix-avatars">
            <div class="rangee-choix-avatars">
                <input
                    type="image"
                    id="avatar1"
                    src="ressources/avatars/avatar1renard.png"
                    alt="avatar renard"
                    width="100"
                    height="100"
                    avatar1="avatar1" required>
                <input
                    type="image"
                    id="avatar2"
                    src="ressources/avatars/avatar2zebre.png"
                    alt="avatar zebre"
                    width="100"
                    height="100"
                    avatar2="avatar2" required>

                <input
                    type="image"
                    id="avatar3"
                    src="ressources/avatars/avatar3perroquet.png"
                    alt="avatar perroquet"
                    width="100"
                    height="100"
                    avatar3="avatar3" required>

                <input
                    type="image"
                    id="avatar4"
                    src="ressources/avatars/avatar4hibou.png"
                    alt="avatar hibou"
                    width="100"
                    height="100"
                    avatar4="avatar4" required>

                <input
                    type="image"
                    id="avatar5"
                    src="ressources/avatars/avatar5parresseux.png"
                    alt="avatar parresseux"
                    width="100"
                    height="100"
                    avatar5="avatar5" required>
            </div>

            <div class="rangee-choix-avatars">
                <input
                    type="image"
                    id="avatar6"
                    src="ressources/avatars/avatar6giraffe.png"
                    alt="avatar giraffe"
                    width="100"
                    height="100"
                    avatar6="avatar6" required>
                    
                <input
                    type="image"
                    id="avatar7"
                    src="ressources/avatars/avatar7pingouin.png"
                    alt="avatar pingouin"
                    width="100"
                    height="100"
                    avatar7="avatar7" required>
                    
                <input
                    type="image"
                    id="avatar8"
                    src="ressources/avatars/avatar8dinosaure.png"
                    alt="avatar dinosaure"
                    width="100"
                    height="100"
                    avatar8="avatar8" required>
                    
                <input
                    type="image"
                    id="avatar9"
                    src="ressources/avatars/avatar9lion.png"
                    alt="avatar lion"
                    width="100"
                    height="100"
                    avatar9="avatar9" required>
                    
                <input
                    type="image"
                    id="avatar10"
                    src="ressources/avatars/avatar10ours.png"
                    alt="avatar lion"
                    width="100"
                    height="100"
                    avatar10="avatar10" required>
            </div>
          </div>
        </form>
        <script src="supabaseConfig.js"></script>
        <script src="scriptChoixAvatar.js"></script>

    </body>

</html>
