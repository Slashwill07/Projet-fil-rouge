<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil - Messages Kids</title>
  <link rel="stylesheet" href="Regles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="accueil">
  <header class="bandeau">
    <h1>Messages Kids</h1>
    <span id="mon-prenom"></span>
    <button id="deconnexion" type="button">Déconnexion</button>
  </header>

  <main class="grille">
    <section class="carte carte-amis">
      <h2>Mes amis</h2>

      <label for="recherche-ami">Rechercher un ami par son prénom</label>
      <div class="recherche">
        <input id="recherche-ami" type="text" placeholder="Prénom">
        <button id="bouton-recherche" type="button">Rechercher</button>
      </div>

      <p id="resultat-recherche" role="status"></p>
      <h3>Demandes reçues</h3>
      <ul id="demandes-recues" class="lignes"></ul>

      <h3>Mes amis</h3>
      <ul id="liste-amis" class="lignes"></ul>
    </section>

    <section class="carte carte-historique">
      <h2>Historique des messages</h2>
      <ul id="historique-messages" class="lignes"></ul>
    </section>
  </main>

  <script src="supabaseConfig.js"></script>
  <script src="scriptAccueil.js"></script>
</body>
</html>
