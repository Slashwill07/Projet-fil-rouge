<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil</title>
  <link rel="stylesheet" href="Regles.css">
</head>
<body class="accueil">

  <!-- Bandeau avec le logo -->
  <header class="bandeau">
    <img src="C:\Users\Alec3\OneDrive\Documents\UQAC\messages kids\image messages kids.png"
    alt="Logo message kids">
  </header>

  <main class="grille">

    <!-- Panneau de gauche : liste d'amis -->
    <section class="carte carte-amis">
      <h2>Liste d'amis</h2>
      <ul class="lignes">
        <li><button type="button" class="pastille" aria-label="Ami 1"></button><button type="button" class="ligne" aria-label="Ami 1"></button></li>
        <li><button type="button" class="pastille" aria-label="Ami 2"></button><button type="button" class="ligne" aria-label="Ami 2"></button></li>
        <li><button type="button" class="pastille" aria-label="Ami 3"></button><button type="button" class="ligne" aria-label="Ami 3"></button></li>
        <li><button type="button" class="pastille" aria-label="Ami 4"></button><button type="button" class="ligne" aria-label="Ami 4"></button></li>
        <li><button type="button" class="pastille" aria-label="Ami 5"></button><button type="button" class="ligne" aria-label="Ami 5"></button></li>
        <li><button type="button" class="pastille" aria-label="Ami 6"></button><button type="button" class="ligne" aria-label="Ami 6"></button></li>
      </ul>

      <!-- À gauche : on écrit le prénom. À droite : le bouton -->
      <div class="recherche">
        <input type="text" id="prenom" name="prenom" placeholder="Écris un prénom" aria-label="Prénom de ton ami">
        <button type="button" class="bouton">Rechercher un ami</button>
      </div>
    </section>

    <!-- Panneau de droite : historique des messages -->
    <section class="carte carte-historique">
      <h2>Historique des messages</h2>
      <h3>Oups ! 😮 Il te manque quelqu’un dans ta liste d’amis ! Ajoute une personne pour continuer l’aventure ! 🎮⭐</h3>
      <ul class="lignes">
        <li><button type="button" class="pastille" aria-label="Message 1"></button><button type="button" class="ligne" aria-label="Message 1"></button></li>
        <li><button type="button" class="pastille" aria-label="Message 2"></button><button type="button" class="ligne" aria-label="Message 2"></button></li>
        <li><button type="button" class="pastille" aria-label="Message 3"></button><button type="button" class="ligne" aria-label="Message 3"></button></li>
        <li><button type="button" class="pastille" aria-label="Message 4"></button><button type="button" class="ligne" aria-label="Message 4"></button></li>
        <li><button type="button" class="pastille" aria-label="Message 5"></button><button type="button" class="ligne" aria-label="Message 5"></button></li>
        <li><button type="button" class="pastille" aria-label="Message 6"></button><button type="button" class="ligne" aria-label="Message 6"></button></li>
      </ul>
    </section>

  </main>

</body>
</html>
