


<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages - Messages Kids</title>
  <link rel="stylesheet" href="Regles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



</head>
<body>
  <div class="app">

    <!-- Liste des salons -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <h1>Salons</h1>
        <a href="./settings.html">Paramètres</a>
      </div>

      <ul id="ul-channels"></ul>

      <form id="form-channel" autocomplete="off">
        <input type="text" id="input-channel" placeholder="Nom du nouveau salon" aria-label="Nom du nouveau salon" maxlength="40">
        <button type="submit" class="btn">Créer</button>
      </form>
    </aside>

    <!-- Messages du salon ouvert -->
    <main class="conversation">
      <header class="conversation-head">
        <button type="button" id="button-back" class="btn btn-ghost">Retour</button>
        <span id="span-channel-title"></span>
      </header>

      <div class="placeholder">
        <p>Choisis un salon dans la liste<br>ou crées-en un nouveau.</p>
      </div>

      <div id="div-messages" aria-live="polite"></div>

      <form id="form-message" autocomplete="off">
        <input type="text" id="input-message" placeholder="Écrire un message" aria-label="Message">
        <button type="submit" class="btn">Envoyer</button>
      </form>
    </main>

  </div>
    <script src="supabaseConfig.js"></script>
    <script>
    // Déconnexion : on ferme la session et on retourne à la page de connexion
    document.querySelector("#deconnexion").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "Connexion.html";
    });
    </script>
    <script src="scriptMessage.js"></script>

</body>
</html>
