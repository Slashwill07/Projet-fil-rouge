<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages - Messages Kids</title>
  <link rel="stylesheet" href="Regles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app">
    <aside class="historique">
      <header class="profil">
        <h1 id="mon-pseudo">Messages Kids</h1>
      </header>

      <nav class="entete-liste">
        <h2>Mes amis</h2>
        <a href="accueil.html">Accueil</a>
      </nav>

      <ul id="conversations" class="conversations"></ul>
    </aside>

    <main class="conversation">
      <header class="titre-conv">
        <h2 id="titre-conversation">Choisis un ami</h2>
      </header>

      <section id="fil" class="fil" aria-live="polite">
        <p>Sélectionne un ami pour commencer.</p>
      </section>

      <form id="form-message" class="saisie">
        <textarea
          id="texte-message"
          placeholder="Écris ton message"
          rows="1"
          maxlength="2000"
          aria-label="Message"
          required
        ></textarea>
        <button type="submit">Envoyer</button>
      </form>

      <p id="statut-message" role="status"></p>
    </main>
  </div>

  <script src="supabaseConfig.js"></script>
  <script src="script.js"></script>
</body>
</html>
