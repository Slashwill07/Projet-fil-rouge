<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion - Messages Kids</title>
  <link rel="stylesheet" href="Regles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="page">
  <h1>Bienvenue sur Messages Kids !</h1>

  <form id="formulaire">
    <label for="prenom">Ton prénom (pour créer un compte) :</label>
    <input id="prenom" type="text" autocomplete="given-name"
           placeholder="Ton prénom">

    <label for="email">Ton e-mail :</label>
    <input id="email" type="email" required autocomplete="email"
           placeholder="exemple@email.com">

    <label for="motdepasse">Mot de passe :</label>
    <input id="motdepasse" type="password" autocomplete="current-password"
           placeholder="8 caractères minimum">

    <button type="submit" id="connexion">Me connecter</button>
    <button type="button" id="inscription">Créer mon compte</button>
    <button type="button" id="oublie">Mot de passe oublié ?</button>

    <p id="resultat" role="status"></p>
  </form>

  <script src="supabaseConfig.js"></script>
  <script src="scriptConnexion.js"></script>
</body>
</html>
