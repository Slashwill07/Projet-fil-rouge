<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion - Messages Kids</title>
  <link rel="stylesheet" href="Regles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="page">
  <h1>Bienvenue sur Messages Kids !</h1>

  <form id="formulaire">
    <label for="prenom">Ton prénom :</label>
    <input id="prenom" type="text" autocomplete="given-name"
           placeholder="Ton prénom">

    <label for="email">Ton e-mail :</label>
    <input id="email" type="email" required autocomplete="email"
           placeholder="exemple@email.com">

    <label for="motdepasse">Mot de passe :</label>
    <input id="motdepasse" type="password" required minlength="8"
           autocomplete="current-password" placeholder="8 caractères minimum">

    <section id="sectionAvatars" hidden>
      <h2>Choisis ton avatar</h2>
      <div id="choixAvatars">
        <img id="avatar1" src="images/avatar1.png" alt="Avatar 1" width="80">
        <img id="avatar2" src="images/avatar2.png" alt="Avatar 2" width="80">
        <img id="avatar3" src="images/avatar3.png" alt="Avatar 3" width="80">
        <img id="avatar4" src="images/avatar4.png" alt="Avatar 4" width="80">
        <img id="avatar5" src="images/avatar5.png" alt="Avatar 5" width="80">
        <img id="avatar6" src="images/avatar6.png" alt="Avatar 6" width="80">
        <img id="avatar7" src="images/avatar7.png" alt="Avatar 7" width="80">
        <img id="avatar8" src="images/avatar8.png" alt="Avatar 8" width="80">
        <img id="avatar9" src="images/avatar9.png" alt="Avatar 9" width="80">
        <img id="avatar10" src="images/avatar10.png" alt="Avatar 10" width="80">
      </div>
    </section>

    <button type="button" id="inscription">Créer mon compte</button>
    <button type="submit" id="connexion">Me connecter</button>
    <p id="resultat" role="status"></p>
  </form>

  <script src="supabaseConfig.js"></script>
  <script src="scriptConnexion.js"></script>
</body>
</html>
