<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion - Messages Kids</title>
  <link rel="stylesheet" href="Regles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="page">
  <h1>Bienvenue sur Messages Kids !</h1>
 
  <form id="formulaire">
    <label for="prenom">Ton prénom (la première fois) :</label>
    <input id="prenom" type="text" autocomplete="given-name"
           placeholder="Ton prénom">
 
    <label for="email">Ton e-mail :</label>
    <input id="email" type="email" required autocomplete="email"
           placeholder="exemple@email.com">
 
    <button type="submit" id="envoyer">Recevoir mon code</button>
 
    <label for="code" id="label-code" hidden>Code reçu par e-mail :</label>
    <input id="code" type="text" inputmode="numeric" maxlength="10"
           autocomplete="one-time-code" placeholder="Le code" hidden>
    <button type="button" id="valider" hidden>Valider</button>
 
    <p id="resultat" role="status"></p>
  </form>
 
  <script src="supabaseConfig.js"></script>
  <script src="scriptConnexion.js"></script>
</body>
</html>
